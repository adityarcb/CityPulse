<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <!-- Glowing pulse wave icon -->
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36D7F0" />
      <stop offset="100%" stop-color="#46E6B0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Atmospheric pulse badge -->
  <rect x="4" y="5" width="40" height="40" rx="10" fill="#0D1B2A" stroke="#1E3A5F" stroke-width="1.5" />
  
  <!-- Pulse wave line -->
  <path d="M10 25 L16 25 L20 16 L24 34 L28 20 L31 27 L38 27" 
        stroke="url(#cyanGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
        
  <!-- Center pulse dot -->
  <circle cx="28" cy="20" r="2" fill="#36D7F0" />

  <!-- Brand Typography -->
  <text x="56" y="27" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0" letter-spacing="-0.3">City<tspan fill="#36D7F0">Pulse</tspan></text>
  <text x="56" y="39" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#8899AA" letter-spacing="1.8">ENVIRONMENTAL INTELLIGENCE</text>
</svg>
